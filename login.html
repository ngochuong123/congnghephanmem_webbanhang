<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - UET Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="register-card">
            <div class="logo">
                <h2>UET<span>Store</span></h2>
            </div>
            <h3>Chào mừng trở lại!</h3>
            <p class="subtitle">Đăng nhập để tiếp tục mua sắm</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="loginPassword">Mật khẩu</label>
                    <input type="password" id="loginPassword" placeholder="Nhập mật khẩu của bạn" required>
                </div>

                <button type="submit" class="btn-register">Đăng nhập</button>
            </form>

            <div class="footer-link">
                Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
            </div>
        </div>
    </div>
    <script src="login.js"></script>
</body>

</html>
