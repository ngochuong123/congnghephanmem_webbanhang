<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Web Đầu Tiên Của Tôi</title>
    <style>
        /* Phần này là CSS - Dùng để trang trí */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        h1 {
            color: #2d3436;
        }

        p {
            color: #636e72;
        }

        button {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
        }

        button:hover {
            background-color: #74b9ff;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1 id="title">SKIyesyes!</h1>
        <p>Đây là trang web đầu tiên được code bởi tôi.</p>
        <p>Học lập trình web tại UET thật thú vị!</p>
        <button onclick="changeColor()">Đổi màu tiêu đề</button>
    </div>

    <script>
        function changeColor() {
            const colors = ['#e17055', '#00b894', '#6c5ce7', '#0984e3', '#d63031'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.getElementById('title').style.color = randomColor;
        }
    </script>

</body>

</html>
