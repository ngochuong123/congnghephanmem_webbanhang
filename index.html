<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>GameStore - Trang chủ</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <header>
        <header>
            <nav class="navbar">
                <div class="nav-left">
                    <div class="logo">Game<span>Store</span></div>
                </div>
                <div class="nav-right">
                    <span id="userGreeting" style="color: #ff4757; font-weight: bold;"></span>

                    <a href="login.html" id="loginLink">Đăng nhập</a>

                    <a href="#" id="logoutLink" style="display: none; color: #ccc; font-size: 14px;">
                        <i class="fa fa-sign-out-alt"></i> Đăng xuất
                    </a>
                    <a href="cart.html" class="cart-icon">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span id="cartCount">0</span>
                    </a>

                    <div class="cart-icon" onclick="window.location.href='cart.html'">
                    </div>
                </div>
            </nav>
        </header>

        <main>
            <section class="search-section">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm game...">
                    <button id="searchBtn"><i class="fa fa-search"></i> Tìm kiếm</button>
                </div>
            </section>

            <section class="products-container">
                <div class="product-grid" id="productGrid">
                </div>
            </section>
        </main>
        <div id="productModal" class="modal">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <div class="modal-body">
                    <div class="modal-left">
                        <img id="modalImg" src="" alt="">
                    </div>
                    <div class="modal-right">
                        <h2 id="modalName"></h2>
                        <p class="modal-price" id="modalPrice"></p>
                        <div class="modal-description">
                            <h4>Mô tả sản phẩm:</h4>
                            <p id="modalDesc">Thông tin chi tiết về game sẽ hiển thị ở đây. Cấu hình yêu cầu, thể loại
                                và nhà phát hành.</p>
                        </div>
                        <button class="btn-add-large">THÊM VÀO GIỎ HÀNG</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="js/main.js"></script>
</body>

</html>
