<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Gamestore</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <div class="register-card">
            <div class="logo">
                <h2>Game<span>Store</span></h2>
            </div>
            <h3>Tạo tài khoản mới</h3>
            <p class="subtitle">Vui lòng điền thông tin để bắt đầu mua sắm</p>

            <form id="registerForm">
                <div class="input-group">
                    <label for="fullname">Họ và tên</label>
                    <input type="text" id="fullname" placeholder="Nguyễn Văn A" required>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="name@example.com" required>
                </div>

                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                </div>

                <button type="submit" class="btn-register">Đăng ký ngay</button>
            </form>

            <div class="footer-link">
                Bạn đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </div>
        </div>
    </div>
    <script src="register.js"></script>
</body>

</html>
