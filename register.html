<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Gamestore</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="logo">
                <h2>Game<span>Store</span></h2>
            </div>
            <h3>Đăng ký</h3>
            <p class="subtitle">Tạo tài khoản để trải nghiệm GameStore</p>

            <form id="registerForm">
                <div class="input-group">
                    <label>Họ và tên</label>
                    <input type="text" id="fullname" placeholder="Nhập tên của bạn" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="example@gmail.com" required>
                </div>
                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu" required minlength="6">
                </div>
                <div class="input-group">
                    <label>Xác nhận mật khẩu</label>
                    <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="btn-register">Đăng ký ngay</button>
            </form>

            <div class="footer-link">
                Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
            </div>
        </div>
    </div>

    <script src="js/register.js"></script>
</body>

</html>
